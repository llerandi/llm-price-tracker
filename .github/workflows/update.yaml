name: Daily Price Update

on:
  schedule:
    # Runs at 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update prices and README
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run update script
        run: python scripts/update_prices.py

      - name: Write daily snapshot
        run: python scripts/snapshot.py

      - name: Generate badge files
        run: python scripts/generate_badges.py

      - name: Generate per-provider files
        run: python scripts/generate_providers.py

      - name: Detect price changes
        id: detect
        env:
          SUMMARY_FILE: /tmp/price_changes.md
        run: python scripts/detect_changes.py >> $GITHUB_OUTPUT

      - name: Open issue for price changes
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Price changes detected on $(date +%Y-%m-%d)" \
            --body-file /tmp/price_changes.md

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history/ data/badges/ data/providers/ README.md
          git diff --staged --quiet || git commit -m "chore: update prices and snapshot [skip ci]"
          git push

  deploy:
    name: Deploy to GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
